<!doctype html>
<html><head><meta charset="utf-8">
<title>teaser</title>
<style>
  html,body{ margin:0; padding:0; width:1080px; height:1920px; overflow:hidden;
    background:#0c1017; font-family: system-ui,-apple-system,"Segoe UI",sans-serif; }
  *{ box-sizing:border-box; }
  .serif{ font-family: ui-serif, Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
  #stage{ position:relative; width:1080px; height:1920px; background:#0c1017; }
  .scene{ position:absolute; inset:0; width:1080px; height:1920px; display:none; }
  .scene.on{ display:block; }

  .eyebrow{ font-size:30px; letter-spacing:0.10em; text-transform:uppercase; color:#e3a83a; font-weight:700; }
  .brandmark{ display:flex; align-items:center; gap:14px; }
  .dot{ width:26px; height:26px; border-radius:50%; display:inline-block; }
  .brandname{ font-size:28px; color:#c3c2b7; font-weight:600; }
  .safe-top{ position:absolute; top:96px; left:64px; right:64px; }
  .tag{
    position:absolute; left:64px; top:1660px; font-size:34px; font-weight:800; color:#fff;
    background:rgba(227,168,58,0.16); border:2px solid rgba(227,168,58,0.55); border-radius:16px;
    padding:16px 28px; display:inline-block;
  }
  svg text{ font-family: system-ui,-apple-system,"Segoe UI",sans-serif; }
</style>
</head>
<body>
<div id="stage">

  <!-- T1: HOOK -->
  <div class="scene" id="t1">
    <div class="safe-top">
      <div class="brandmark">
        <span class="dot" style="background:#eda100"></span>
        <span class="dot" style="background:#9a9890;margin-left:-14px"></span>
        <span class="dot" style="background:#3987e5;margin-left:-14px"></span>
        <span class="brandname">Centro Javeriano de Competitividad</span>
      </div>
    </div>
    <div id="t1-title" class="serif" style="position:absolute; left:64px; right:64px; top:44%; transform:translateY(-50%);
      font-size:100px; line-height:1.08; color:#ffffff; font-weight:800; text-wrap:balance;"></div>
    <div id="t1-sub" style="position:absolute; left:64px; right:64px; top:66%; font-size:40px; color:#e3a83a; font-weight:700;"></div>
  </div>

  <!-- T2: BUBBLES GLIMPSE -->
  <div class="scene" id="t2">
    <div id="t2-chart" style="position:absolute; left:20px; right:20px; top:120px; bottom:520px;"></div>
    <div id="t2-cursor" style="position:absolute; width:34px; height:34px; margin:-17px 0 0 -17px; border-radius:50%; background:rgba(255,255,255,0.92); box-shadow:0 0 0 8px rgba(255,255,255,0.18), 0 6px 20px rgba(0,0,0,0.4); pointer-events:none; opacity:0;"></div>
    <div id="t2-tooltip" style="position:absolute; display:none; background:#171b22; border:2px solid rgba(255,255,255,0.16); border-radius:16px; padding:20px 24px; color:#fff; min-width:320px;"></div>
    <div class="tag" id="t2-tag">Explora cada sector</div>
  </div>

  <!-- T3: SEARCH GLIMPSE -->
  <div class="scene" id="t3">
    <div id="t3-body" style="position:absolute; left:64px; right:64px; top:640px;"></div>
    <div class="tag" id="t3-tag">Busca lo que te interesa</div>
  </div>

  <!-- T4: RANKING GLIMPSE -->
  <div class="scene" id="t4">
    <div id="t4-body" style="position:absolute; left:64px; right:64px; top:420px;"></div>
    <div class="tag" id="t4-tag">Mira quién va ganando</div>
  </div>

  <!-- T5: SCATTER GLIMPSE -->
  <div class="scene" id="t5">
    <div id="t5-chart" style="position:absolute; left:60px; right:60px; top:220px; bottom:520px;"></div>
    <div class="tag" id="t5-tag">Descubre patrones ocultos</div>
  </div>

  <!-- T6: CTA -->
  <div class="scene" id="t6">
    <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:0 90px;">
      <div class="brandmark" id="t6-brand" style="margin-bottom:56px;">
        <span class="dot" style="background:#eda100"></span>
        <span class="dot" style="background:#9a9890;margin-left:-14px"></span>
        <span class="dot" style="background:#3987e5;margin-left:-14px"></span>
      </div>
      <div id="t6-title" class="serif" style="font-size:88px; color:#fff; font-weight:800; line-height:1.2;"></div>
      <div id="t6-sub" style="margin-top:36px; font-size:38px; color:#c3c2b7; font-weight:600; max-width:820px;"></div>
      <div id="t6-cta" style="margin-top:56px; font-size:34px; color:#0c1017; font-weight:800; background:#e3a83a; padding:22px 44px; border-radius:40px;"></div>
    </div>
  </div>

</div>
<script src="video_data.js?v=5"></script>
<script src="teaser_timeline.js?v=1"></script>
</body></html>
